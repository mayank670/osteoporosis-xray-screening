[pytest]
testpaths = tests
pythonpath = .
# Temporary test files go to the project drive, not C:\Users\...\Temp
addopts = --basetemp=.pytest_tmp
filterwarnings =
    # Raised inside Keras/NumPy, not by project code (Keras 3.10 + NumPy 2.1).
    ignore:__array__ implementation doesn.t accept a copy keyword:DeprecationWarning
